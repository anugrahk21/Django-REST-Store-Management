<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Management - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'dashboard' %}">Store Admin</a>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-secondary theme-toggle" id="themeToggle" type="button">
                    <i class="bi bi-moon-stars"></i>
                    <span class="ms-1">Theme</span>
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-sm btn-outline-light">Dashboard</a>
                <a href="{% url 'revenue' %}" class="btn btn-sm btn-outline-light">Revenue</a>
                <a href="{% url 'product_create' %}" class="btn btn-sm btn-primary">Add Product</a>
                <a href="{% url 'home' %}" class="btn btn-sm btn-outline-light" target="_blank">View Store</a>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-danger">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endif %}

        <h3 class="mb-4">{% block page_title %}{% endblock %}</h3>
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const root = document.documentElement;
            const toggleBtn = document.getElementById('themeToggle');
            const savedTheme = localStorage.getItem('theme') || 'dark';

            function applyTheme(theme) {
                root.setAttribute('data-theme', theme);
                if (toggleBtn) {
                    toggleBtn.innerHTML = theme === 'dark'
                        ? '<i class="bi bi-sun"></i><span class="ms-1">Light</span>'
                        : '<i class="bi bi-moon-stars"></i><span class="ms-1">Dark</span>';
                }
            }

            applyTheme(savedTheme);

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function () {
                    const current = root.getAttribute('data-theme') || 'dark';
                    const next = current === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('theme', next);
                    applyTheme(next);
                });
            }
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
